/* VOICE: a kind, patient maître d'école; short sentences, praise first, then the rule.
   IDEA: the CM1 cahier itself: Seyès ruling, red margin, the teacher's blue, red and green inks.
   PICTURE: Kalou the hornbill, perched on a pencil, cheering her on.
   COLOUR and TYPE: white paper, ink blue, margin red, leaf green, sun yellow stars; a slate board at night. Playwrite FR Moderne (French school cursive) for titles, Andika (made for young readers) for text.
   LAYOUT: one calm column, big 52px+ buttons, cards laid on ruled paper; stacks naturally on phones. */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#17221e);--l1:light-dark(#e6eaf8,#22302b);--l2:light-dark(#c9d2f1,#2b3c35);--mg:light-dark(#ef9aa8,#8f3d4b);

--btn:light-dark(#2343c4,#3d5bd9);--btnD:light-dark(#152c8c,#26399c);--gbtn:light-dark(#11784a,#1e9562);--gbtnD:light-dark(#0a5233,#146843);

:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%}
body{margin:0;color:var(--ink);font:17px/1.55 Andika,"Trebuchet MS",system-ui,sans-serif;overflow-x:clip;background-color:var(--bg);
background-image:linear-gradient(90deg,transparent 0 46px,var(--mg) 46px 48px,transparent 48px),linear-gradient(var(--l2) 1px,transparent 1px),linear-gradient(var(--l1) 1px,transparent 1px);
background-size:100% 100%,100% 32px,100% 8px}
@media(max-width:600px){body{background-image:linear-gradient(90deg,transparent 0 9px,var(--mg) 9px 11px,transparent 11px),linear-gradient(var(--l2) 1px,transparent 1px),linear-gradient(var(--l1) 1px,transparent 1px)}}
#app{max-width:780px;margin:0 auto;padding:18px 18px 80px 64px}
@media(max-width:600px){#app{padding:14px 12px 80px 22px}}
h1,h2,h3{margin:0;font-weight:400}
.cur{font-family:"Playwrite FR Moderne","Segoe Script",cursive;color:var(--blue);line-height:1.45;text-wrap:balance}
h1.cur{font-size:clamp(26px,6vw,40px)}h2.cur{font-size:clamp(22px,5vw,30px)}
.muted{color:var(--soft)}.small{font-size:14px}
.card{background:var(--card);border:2px solid var(--edge);border-radius:20px;padding:18px;box-shadow:0 3px 0 var(--edge)}
.stack>*+*{margin-top:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{appearance:none;border:0;border-radius:16px;min-height:52px;padding:12px 18px;font:700 18px/1.2 Andika,sans-serif;background:var(--btn);color:#fff;box-shadow:0 4px 0 var(--btnD);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:10px;text-align:center;text-decoration:none}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--btnD)}
.btn.g{background:var(--gbtn);box-shadow:0 4px 0 var(--gbtnD)}
.btn.gh{background:var(--card);color:var(--blue);border:2px solid var(--edge);box-shadow:0 3px 0 var(--edge)}
.btn.sm{min-height:44px;padding:8px 14px;font-size:16px}
.btn.big{width:100%;min-height:64px;font-size:21px}
.btn[disabled]{opacity:.5;pointer-events:none}
.link{background:none;border:0;color:var(--blue);font:inherit;text-decoration:underline;cursor:pointer;min-height:44px;padding:8px 4px}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
svg{display:block}
.hero{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:12px;align-items:center}
@media(max-width:600px){.hero{grid-template-columns:minmax(0,1fr)}.hero .kal{order:-1;max-width:260px;margin:0 auto}}
.bubble{position:relative;background:var(--hl);border-radius:18px;padding:12px 16px;font-size:18px;margin-top:10px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{text-align:center;padding:12px 6px}.stat b{display:block;font-size:26px;line-height:1.1}.stat span{font-size:14px;color:var(--soft)}
.stat svg{margin:0 auto 4px}
.bar{height:10px;border-radius:6px;background:var(--l1);overflow:hidden}.bar>i{display:block;height:100%;background:var(--c,var(--green));border-radius:6px}

.ic{width:46px;height:46px;flex:none}.subj .ic{width:40px;height:40px}.top .ic,.row>.ic{width:40px;height:40px}
.subj b{font-size:17px;line-height:1.25}
.les{appearance:none;font:inherit;color:var(--ink);text-align:left;width:100%;cursor:pointer;display:flex;gap:12px;align-items:center;padding:14px 16px}
.les .t{flex:1}.les .t b{display:block;font-size:17px;line-height:1.3}.les .t span{font-size:14px;color:var(--soft)}
.chip{flex:none;font-size:13px;font-weight:700;border-radius:999px;padding:4px 10px;background:var(--l1);color:var(--soft);white-space:nowrap}
.chip.ok{background:var(--ok);color:var(--green)}.chip.mid{background:var(--hl);color:var(--orange)}.chip.lo{background:var(--ko);color:var(--red)}
.dom{font-weight:700;color:var(--soft);font-size:15px;margin:18px 0 8px}
.tag{display:inline-block;font-size:14px;font-weight:700;color:light-dark(var(--c,#2343c4),color-mix(in srgb,var(--c,#2343c4) 45%,#fff));background:color-mix(in srgb,var(--c,var(--blue)) 12%,transparent);border-radius:999px;padding:4px 12px}
.rule{font-size:18px;line-height:1.7}.rule p{margin:0 0 8px}.rule ul{margin:0 0 8px;padding-left:20px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.top .sp{flex:1}
.qtop{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.dots{flex:1;display:flex;gap:5px;flex-wrap:wrap}.dots i{width:14px;height:14px;border-radius:50%;background:var(--l2)}.dots i.g{background:var(--green)}.dots i.r{background:var(--red)}.dots i.c{background:var(--sun);transform:scale(1.25)}

.qtext{font-size:clamp(20px,4.6vw,24px);line-height:1.45;margin:12px 0 14px}
.blank{display:inline-block;min-width:3.2em;border-bottom:3px dashed var(--blue);color:var(--blue);text-align:center;font-weight:700}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.15;margin:0 .15em;font-weight:700}.fr>span:first-child{border-bottom:2px solid currentColor;padding:0 .25em}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);color:var(--ink);border:2px solid var(--edge);border-radius:16px;min-height:56px;padding:10px 14px;font:inherit;font-size:19px;box-shadow:0 3px 0 var(--edge);cursor:pointer}
.opt .lt{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--l1);color:var(--blue);font-weight:700}
.opt.good{border-color:var(--green);background:var(--ok)}.opt.bad{border-color:var(--red);background:var(--ko)}.opt[disabled]{cursor:default}
.inrow{display:flex;gap:10px;align-items:stretch}
.inp{width:100%;font:inherit;font-size:20px;padding:12px 14px;border:2px solid var(--edge);border-radius:14px;background:var(--card);color:var(--ink)}
textarea.inp{min-height:110px;resize:vertical;font-size:18px}
.mic,.ib{flex:none;width:56px;height:56px;border-radius:50%;border:2px solid var(--edge);background:var(--card);color:var(--red);display:grid;place-items:center;cursor:pointer;box-shadow:0 3px 0 var(--edge)}
.ib{width:48px;height:48px;color:var(--blue)}
.mic.on{background:var(--red);color:#fff;border-color:var(--red);animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 10px color-mix(in srgb,var(--red) 25%,transparent)}}
.heard{font-size:15px;color:var(--soft);min-height:22px;margin-top:6px}
.fb{margin-top:16px;border-radius:16px;padding:14px 16px;font-size:18px}
.fb.ok{background:var(--ok)}.fb.ko{background:var(--ko)}
.recall{margin-top:10px;background:var(--card);border-radius:12px;padding:10px 12px;font-size:17px}
.fb .h{display:flex;align-items:center;gap:10px;font-weight:700;font-size:21px}
.fb p{margin:8px 0 0}
.pose{display:inline-grid;justify-items:end;font:600 22px/1.3 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.08em;margin-top:8px;background:var(--card);border-radius:10px;padding:8px 14px}

.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;max-width:min(92vw,520px);z-index:9;font-size:16px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
table{border-collapse:collapse;width:100%;font-size:15px}th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--edge);vertical-align:top}td.n{text-align:right;white-space:nowrap}
.seg{display:inline-flex;border:2px solid var(--edge);border-radius:14px;overflow:hidden}.seg button{appearance:none;border:0;background:var(--card);color:var(--ink);font:inherit;min-height:44px;padding:8px 14px;cursor:pointer}.seg button.on{background:var(--btn);color:#fff}
.sw{display:flex;align-items:center;gap:10px;min-height:44px;cursor:pointer}.sw input{width:22px;height:22px}
.note{font-size:15px;background:var(--hl);border-radius:12px;padding:10px 12px}
.prev{border:2px dashed var(--edge);border-radius:14px;padding:12px}
.spin{width:22px;height:22px;border:3px solid var(--l2);border-top-color:var(--blue);border-radius:50%;animation:sp 1s linear infinite;display:inline-block;vertical-align:middle}@keyframes sp{to{transform:rotate(360deg)}}
.scroll{overflow-x:auto}
@media(max-width:600px){table{font-size:13px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:8em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:7.5em;margin-inline-start:-8em;white-space:normal;color:var(--soft)}.stack td:empty{display:none}}
</style>

{id:"m-fractions",s:"maths",dom:"Fractions",d:"2026-11-02",t:"Les fractions",g:"fractionsLire",
r:"Quand on partage une unité en parts égales, chaque part représente une fraction.\nDans [3/5] : 3 est le numérateur (en haut), 5 est le dénominateur (en bas, le nombre de parts égales).\n[2/5] se lit deux cinquièmes ; [1/4] un quart ; [1/3] un tiers ; [1/2] un demi.",
q:[["Dans [3/5], comment s'appelle 3 ?",["Le numérateur","Le dénominateur","La barre de fraction"]],["Dans [3/5], comment s'appelle 5 ?",["Le dénominateur","Le numérateur","Le quotient"]],["Comment lit-on [1/4] ?",["Un quart","Un quatrième","Un tiers"]],["Comment lit-on [1/2] ?",["Un demi","Un deuxième","Un tiers"]],["Comment lit-on [1/3] ?",["Un tiers","Un troisième","Un quart"]]]},
{id:"m-frac-equiv",s:"maths",dom:"Fractions",d:"2026-11-03",t:"Les fractions équivalentes",g:"fractionsEquiv",
r:"Pour écrire une fraction équivalente, je multiplie ou je divise le numérateur ET le dénominateur par un même nombre différent de zéro.\nExemple : [10/5] = [20/10] (× 2) = [200/100] (× 20).\n[10/5] = [2/1] (: 5).",
q:[["Pour obtenir une fraction équivalente, que fait-on ?",["On multiplie ou on divise le numérateur et le dénominateur par le même nombre","On multiplie seulement le numérateur","On ajoute 1 en haut et en bas"]],["Complète : [10/5] = [20/?]",10],["Par quel nombre ne peut-on jamais multiplier ou diviser ?",["Zéro","Deux","Dix"]]]},
{id:"m-frac-dec",s:"maths",dom:"Fractions",d:"2026-11-09",t:"Les fractions décimales",g:"fractionsDecimales",
r:"Une fraction décimale est une fraction dont le dénominateur est 1, 10, 100 ou 1 000.\nElle peut s'écrire sous forme de nombre décimal :\n[9/10] = 0,9 ; [7/100] = 0,07 ; [406/1000] = 0,406 ; [635/100] = 6,35 ; [8/1000] = 0,008.",
q:[["Laquelle est une fraction décimale ?",["[7/100]","[3/4]","[2/5]"]],["Écris [9/10] sous forme de nombre décimal.",0.9],["Écris [5/100] sous forme de nombre décimal.",0.05]]},
{id:"m-decimaux",s:"maths",dom:"Nombres décimaux",d:"2026-11-09",t:"Les nombres décimaux",g:"decimauxLire",
r:"Un nombre décimal a une partie entière, avant la virgule, et une partie décimale, après la virgule.\nExemple : 105,02 → partie entière 105, partie décimale 02.\n206,72 se lit deux cent six unités soixante-douze centièmes.\n206,7 se lit deux cent six unités sept dixièmes.",
q:[["Dans 105,02, quelle est la partie entière ?",105],["Où se trouve la partie décimale ?",["Après la virgule","Avant la virgule","Au milieu du nombre"]],["Comment lit-on 206,7 ?",["Deux cent six unités sept dixièmes","Deux cent six unités sept centièmes","Deux mille soixante-sept"]]]},
{id:"m-frac-comparer",s:"maths",dom:"Fractions",d:"2026-11-09",t:"Comparer des fractions",g:"fractionsComparer",
r:"Même dénominateur : la plus grande fraction a le plus grand numérateur. [11/3] > [7/3]\nMême numérateur : la plus grande fraction a le plus petit dénominateur. [17/8] > [17/10]\nSi le numérateur est plus grand que le dénominateur, la fraction est plus grande que 1. [23/12] > 1\nSi le numérateur et le dénominateur sont égaux, la fraction est égale à 1. [37/37] = 1",
q:[["Compare [11/3] et [7/3].",["[11/3] > [7/3]","[11/3] < [7/3]","[11/3] = [7/3]"]],["Compare [17/8] et [17/10].",["[17/8] > [17/10]","[17/8] < [17/10]","[17/8] = [17/10]"]],["Combien vaut [37/37] ?",1],["[23/12] est-elle plus grande ou plus petite que 1 ?",["Plus grande que 1","Plus petite que 1","Égale à 1"]]]},
{id:"m-dec-comparer",s:"maths",dom:"Nombres décimaux",d:"2026-11-10",t:"Comparer des nombres décimaux",g:"decimauxComparer",
r:"Je compare d'abord les parties entières : 34,7 > 32,62 car 34 > 32.\nSi les parties entières sont égales, je compare les dixièmes, puis les centièmes, puis les millièmes.\nExemple : 4,32 < 4,62 car 3 dixièmes < 6 dixièmes.",
q:[["Que compare-t-on en premier ?",["Les parties entières","Les centièmes","Le nombre de chiffres après la virgule"]],["Compare 4,32 et 4,62.",["4,32 < 4,62","4,32 > 4,62","4,32 = 4,62"]],["Compare 34,7 et 32,62.",["34,7 > 32,62","34,7 < 32,62","34,7 = 32,62"]]]},
/* ---------- FRANÇAIS : VOCABULAIRE ---------- */
{id:"f-voc-impot",s:"francais",dom:"Vocabulaire",d:"2026-09-15",t:"Les mots du citoyen et de l'impôt",
r:"Un contribuable : une personne qui paie l'impôt.\nUn intérêt de retard : la somme d'argent que le contribuable paie en plus à l'État lorsqu'il paie son impôt en retard.\nUne saisie de biens : le fait de confisquer les biens d'un mauvais contribuable.\nUn inspecteur des impôts : un agent des impôts chargé de vérifier les déclarations des biens.",
q:[["Comment appelle-t-on une personne qui paie l'impôt ?",["Un contribuable","Un inspecteur","Un commerçant"]],["Qu'est-ce qu'un intérêt de retard ?","La somme que le contribuable paie en plus quand il paie son impôt en retard",["retard","plus|supplement"],2],["Qu'est-ce qu'une saisie de biens ?",["Confisquer les biens d'un mauvais contribuable","Acheter de nouveaux biens","Vendre ses biens au marché"]],["Qui vérifie les déclarations des biens ?",["L'inspecteur des impôts","Le boutiquier","Le maître d'école"]]]},
{id:"f-voc-radical",s:"francais",dom:"Vocabulaire",d:"2026-09-21",t:"La racine ou le radical d'un mot",
r:"La racine (ou le radical) d'un mot est la base sur laquelle se forment d'autres mots.\nExemples : vent → ventilateur, éventail, ventiler.\nplant → plantation, plante, planteur.",
q:[["Quel est le radical commun à ventilateur, éventail et ventiler ?",["vent","venti","lateur"]],["Quel mot a le même radical que « plante » ?",["planteur","planche","plaine"]],["Qu'est-ce que le radical d'un mot ?","La base sur laquelle se forment d'autres mots",["base|racine"]],["Quel est le radical commun à terrain, terrasse et enterrer ?",["terr","ain","enter"]],["Quel mot n'est pas de la famille de « dent » ?",["soldat","dentiste","dentifrice"]]]},
{id:"f-voc-conflit",s:"francais",dom:"Vocabulaire",d:"2026-09-29",t:"Les mots du traitement des conflits",
r:"Le médiateur : une personne qui règle les conflits. Mots de la même famille : la médiatrice, la médiation.\nNégocier (verbe du 1er groupe) : discuter pour se mettre d'accord. Mots de la même famille : le négociateur, la négociation.\nLa réinsertion sociale : le fait de cesser d'être soldat pour retourner à la vie sociale.",
q:[["Comment appelle-t-on une personne qui règle les conflits ?",["Un médiateur","Un soldat","Un contribuable"]],["Que veut dire « négocier » ?","Discuter pour se mettre d'accord",["discut|parl","accord"],2],["Quel mot est de la même famille que « négocier » ?",["La négociation","La neige","Le négatif"]],["Qu'est-ce que la réinsertion sociale ?",["Cesser d'être soldat pour retourner à la vie sociale","Partir à la guerre","Construire une maison"]]]},
{id:"f-voc-prefixe",s:"francais",dom:"Vocabulaire",d:"2026-10-13",t:"Le préfixe",
r:"Le préfixe est la lettre ou le groupe de lettres placé devant le radical d'un mot.\nQuelques préfixes : re-, a-, in-, im-, dé-, sur-, anti-…\nExemples : reposer, alourdir, surabondance, impossible, dévisser.",
q:[["Où se place le préfixe ?",["Devant le radical","Après le radical","À la fin de la phrase"]],["Quel est le préfixe de « impossible » ?",["im","ible","poss"]],["Quel est le préfixe de « dévisser » ?",["dé","er","vis"]],["Quel est le préfixe de « surabondance » ?",["sur","ance","abond"]],["Quel mot commence par le préfixe re- ?",["refaire","rire","rouge"]]]},
{id:"f-voc-homonymes",s:"francais",dom:"Vocabulaire",d:"2026-10-20",t:"Les homonymes",
r:"Les homonymes sont des mots qui se prononcent de la même façon mais qui n'ont pas le même sens. Ils peuvent s'écrire de la même manière ou de manière différente.\nExemples : le bout (l'extrémité, un morceau), il bout (verbe bouillir), la boue (de la terre mouillée).",
q:[["Que sont des homonymes ?",["Des mots qui se prononcent pareil mais n'ont pas le même sens","Des mots qui ont le même sens","Des mots contraires"]],["Dans « l'eau bout », que veut dire « bout » ?",["Elle bouillit","L'extrémité","Un morceau"]],["Comment écrit-on la terre mouillée ?",["la boue","le bout","il bout"]],["Quel est l'homonyme de « la mer » ?",["la mère","le mur","la mare"]]]},
{id:"f-voc-orientation",s:"francais",dom:"Vocabulaire",d:"2026-11-05",t:"Les mots de l'orientation et de l'entrepreneuriat",
r:"Une décoratrice : une femme qui fabrique ou dessine des choses qui servent à embellir un lieu ou un bâtiment.\nUne qualification : l'ensemble des savoirs, des savoir-faire et des qualités d'un travailleur.\nUne maquette : la représentation réduite d'un objet.\nL'entrepreneuriat : la création d'entreprise.",
q:[["Qu'est-ce que l'entrepreneuriat ?",["La création d'entreprise","Un métier de la mer","Une fête du village"]],["Qu'est-ce qu'une maquette ?",["La représentation réduite d'un objet","Un grand bâtiment","Un outil de cuisine"]],["Que fait une décoratrice ?","Elle fabrique ou dessine des choses pour embellir un lieu",["embell|beau|decor"]],["La qualification, c'est…",["L'ensemble des savoirs, savoir-faire et qualités d'un travailleur","Le salaire d'un travailleur","Le bureau d'un travailleur"]]]},
{id:"f-voc-protection",s:"francais",dom:"Vocabulaire",d:"2026-11-10",t:"Les mots de la protection de l'enfant",
r:"Une victime : une personne sans défense qui subit des violences.\nLa maltraitance : le fait de violenter quelqu'un.\nLa discrimination : le fait de faire des différences injustes entre les uns et les autres.",
q:[["Qu'est-ce qu'une victime ?",["Une personne sans défense qui subit des violences","Une personne qui aide les autres","Un médecin"]],["Qu'est-ce que la maltraitance ?","Le fait de violenter quelqu'un",["violen|frapp|maltrait|faire du mal"]],["Faire des différences injustes entre les personnes, c'est…",["La discrimination","La médiation","La négociation"]]]},
{id:"f-voc-suffixe",s:"francais",dom:"Vocabulaire",d:"2026-11-17",t:"Les suffixes",
r:"Le suffixe est un groupe de lettres qu'on ajoute après le radical d'un mot pour former d'autres mots.\nQuelques suffixes : -ment, -ation, -eur, -ie, -esse, -al…\nExemples : richesse (riche + esse), renforcement (renforce + ment), national (nation + al).",
q:[["Où se place le suffixe ?",["Après le radical","Devant le radical","Au début du mot"]],["Quel est le suffixe de « richesse » ?",["esse","riche","ri"]],["Quel est le suffixe de « national » ?",["al","nation","na"]],["J'ajoute le suffixe -eur à « chant ». Quel mot j'obtiens ?",["chanteur","chantier","enchanté"]]]},
/* ---------- FRANÇAIS : ORTHOGRAPHE ---------- */
{id:"f-ortho-mais",s:"francais",dom:"Orthographe",d:"2026-09-15",t:"mais, mes, met, mets",g:"homo_mais",
r:"mets (nom) : un repas, un plat. Il s'écrit toujours avec un s, même au singulier : J'aime les mets de mon pays.\nmais : mot de liaison qui marque une opposition (on peut dire « pourtant ») : J'ai soif mais il n'y a pas d'eau.\nmets, met (verbe mettre au présent) : je mets, tu mets, il met : Il met sa chemise.\nmes : adjectif possessif, pluriel de mon, ma : Mes activités sont florissantes.",
q:[["Comment s'écrit le nom qui veut dire « un plat » ?",["un mets","un mai","un mes"]],["« mes » est le pluriel de…",["mon et ma","mais","mettre"]]]},
{id:"f-ortho-adverbes",s:"francais",dom:"Orthographe",d:"2026-09-21",t:"Les adverbes en -ment, -amment, -emment",g:"adverbes",
r:"En général, on forme l'adverbe en ajoutant -ment à l'adjectif au féminin : financière → financièrement ; morale → moralement.\nAdjectif en -ant → adverbe en -amment : vaillant → vaillamment.\nAdjectif en -ent → adverbe en -emment : violent → violemment.",
q:[["Un adjectif en -ant donne un adverbe en…",["-amment","-emment","-ement"]],["Un adjectif en -ent donne un adverbe en…",["-emment","-amment","-antment"]],["À quelle forme de l'adjectif ajoute-t-on -ment en général ?",["Au féminin","Au pluriel","Au verbe"]]]},
{id:"f-ortho-af",s:"francais",dom:"Orthographe",d:"2026-09-29",t:"Les mots commençant par af-, ef-, of-",g:"afefof",
r:"Les mots commençant par af-, ef-, of- s'écrivent en général avec deux f : une affiche, effrayer, une offrande.\nSauf : afin, l'Afrique et les mots de la même famille (africain…).",
q:[["En général, combien de f après af-, ef-, of- ?",["Deux f","Un seul f","Trois f"]],["Quels mots font exception ?",["afin et Afrique","affiche et offrir","effort et effacer"]]]},
{id:"f-ortho-cetait",s:"francais",dom:"Orthographe",d:"2026-10-13",t:"c'était, c'étaient, s'était, s'étaient",g:"homo_cetait",
r:"On écrit s'était / s'étaient quand on peut mettre il, elle (ou ils, elles) devant : La discussion s'était poursuivie → Elle s'était poursuivie.\nDans les autres cas, on écrit c'était / c'étaient (on peut dire « cela était ») : C'était le plus riche. C'étaient les plus riches.",
q:[["Quand écrit-on « s'était » ?",["Quand on peut mettre il ou elle devant","Quand on peut dire « cela était »","Toujours"]],["« c'était » peut se remplacer par…",["cela était","il était lui-même","ses"]]]},
{id:"f-ortho-la",s:"francais",dom:"Orthographe",d:"2026-10-20",t:"la, l'a, l'as, là",g:"homo_la",
r:"la devant un nom : on peut le remplacer par une (déterminant) : la couturière → une couturière.\nla devant un verbe : on peut le remplacer par les (pronom COD) : le mécanicien la répare → les répare.\nl'a, l'as devant un participe passé : on peut les remplacer par l'avait, l'avais : Elle l'a vendue → Elle l'avait vendue. Tu l'as vendue → Tu l'avais vendue.\nlà : adverbe de lieu, on peut le remplacer par ici : Ton bureau est là → ici.",
q:[["« là » avec un accent peut se remplacer par…",["ici","une","l'avait"]],["« l'a » peut se remplacer par…",["l'avait","une","ici"]]]},
{id:"f-ortho-adjverbal",s:"francais",dom:"Orthographe",d:"2026-11-05",t:"Adjectif verbal ou participe présent ?",g:"adjverbal",
r:"Les deux viennent d'un verbe et se terminent par -ant.\nLe participe présent est invariable. Il peut être précédé de « en » : Les soldats quittent le village en enlevant les enfants.\nL'adjectif verbal s'accorde en genre et en nombre avec le nom : face à la souffrance grandissante → face aux souffrances grandissantes.",
q:[["Lequel est invariable ?",["Le participe présent","L'adjectif verbal","Les deux"]],["Lequel s'accorde avec le nom ?",["L'adjectif verbal","Le participe présent","Aucun des deux"]]]},
{id:"f-ortho-ces",s:"francais",dom:"Orthographe",d:"2026-11-10",t:"ces, ses, s'est, c'est",g:"homo_ces",
r:"c'est : on peut le remplacer par cela est, ceci est : C'est une loi pour les enfants.\ns'est : il est précédé de il ou elle : La pauvreté s'est développée → elle s'est développée.\nces : adjectif démonstratif, pluriel de ce, cet, cette : Ces enfants sont malades → cet enfant est malade.\nses : adjectif possessif, pluriel de son, sa : Il défend ses droits → son droit.",
q:[["« ses » est le pluriel de…",["son et sa","ce et cette","c'est"]],["« ces » est le pluriel de…",["ce, cet, cette","son, sa","s'est"]]]},
/* ---------- FRANÇAIS : GRAMMAIRE ---------- */
{id:"f-gram-simple",s:"francais",dom:"Grammaire",d:"2026-09-19",t:"La phrase simple",g:"phraseSimple",
r:"Une phrase simple contient un seul verbe conjugué.\nExemples : Maman pile du riz. Mariam lave son bébé.",
q:[["Combien de verbes conjugués contient une phrase simple ?",1],["Quel est le verbe conjugué dans « Maman pile du riz » ?",["pile","Maman","riz"]]]},
{id:"f-gram-ponct",s:"francais",dom:"Grammaire",d:"2026-09-25",t:"La ponctuation",g:"ponctuation",
r:"On emploie la ponctuation pour rendre la phrase claire et facile à comprendre.\n• Le point (.) indique la fin d'une phrase.\n• La virgule (,) marque une légère pause ; le point-virgule (;) une pause plus grande.\n• Le point d'exclamation (!) exprime l'étonnement, la colère ou l'admiration.\n• Le point d'interrogation (?) sert à poser une question.\n• Les points de suspension (…) indiquent une phrase inachevée.\n• Les deux points (:) servent à rapporter des paroles ou à donner une explication.\n• Les guillemets (« ») indiquent le début et la fin d'un dialogue ou d'une citation.\n• Le tiret indique le changement d'interlocuteur dans un dialogue.",
q:[["Quel signe marque une légère pause ?",["La virgule","Le point","Le tiret"]],["Quel signe indique le changement d'interlocuteur dans un dialogue ?",["Le tiret","La virgule","Le point-virgule"]],["À quoi servent les points de suspension ?",["À indiquer une phrase inachevée","À poser une question","À finir un dialogue"]],["À quoi servent les guillemets ?",["À indiquer le début et la fin d'un dialogue ou d'une citation","À marquer une pause","À poser une question"]]]},
{id:"f-gram-types",s:"francais",dom:"Grammaire",d:"2026-10-02",t:"Les types de phrases",g:"typesPhrases",
r:"Il existe 4 types de phrases :\n• la phrase déclarative informe, déclare quelque chose : Nous avons tous des droits et des devoirs.\n• la phrase interrogative pose une question : Quels sont les droits de la jeune fille ?\n• la phrase impérative donne un ordre ou un conseil : Ferme la porte en sortant.\n• la phrase exclamative exprime l'étonnement, l'admiration… Elle se termine toujours par un point d'exclamation et peut ne pas contenir de verbe : Quelle belle journée !",
q:[["Combien y a-t-il de types de phrases ?",4],["Quelle phrase donne un ordre ou un conseil ?",["La phrase impérative","La phrase déclarative","La phrase interrogative"]],["Par quel signe se termine toujours une phrase exclamative ?",["Le point d'exclamation","Le point","Le point d'interrogation"]]]},
{id:"f-gram-gn",s:"francais",dom:"Grammaire",d:"2026-10-23",t:"Les constituants du groupe nominal",g:"groupeNominal",
r:"Le groupe nominal (GN) peut être constitué :\n• d'un nom propre : Koré, Yapo ;\n• d'un déterminant + un nom commun : mon oncle, ma tante ;\n• d'un déterminant + un nom commun + un adjectif : un métier plaisant, ma chère sœur ;\n• d'un déterminant + un nom commun + un complément du nom : un cahier de devoirs.",
q:[["Quel est le mot principal d'un groupe nominal ?",["Le nom","Le verbe","L'adjectif"]],["« Yapo » est…",["Un nom propre","Un adjectif","Un verbe"]]]},
{id:"f-gram-cod",s:"francais",dom:"Grammaire",d:"2026-11-06",t:"Le complément d'objet direct (COD)",g:"cod",
r:"Le COD peut être un groupe nominal ou un pronom personnel.\nLes pronoms personnels COD sont : le, la, les, l' (et parfois en). Ils remplacent un groupe nominal déjà cité, pour éviter la répétition.\nQuand le COD est un pronom personnel, il se place avant le verbe.\nExemple : Les parents protègent les enfants → Les parents les protègent.",
q:[["Où se place le COD quand c'est un pronom personnel ?",["Avant le verbe","Après le verbe","À la fin de la phrase"]],["Lequel est un pronom personnel COD ?",["les","mon","avec"]]]},
/* ---------- FRANÇAIS : CONJUGAISON ---------- */
{id:"f-conj-present",s:"francais",dom:"Conjugaison",d:"2026-09-19",t:"Le présent des verbes du 1er et du 2e groupe",g:"conj_present12",
r:"1er groupe : terminaisons e, es, e, ons, ez, ent. (voter) je vote, tu votes, il/elle vote, nous votons, vous votez, ils/elles votent.\nAttention : le verbe aller appartient au 3e groupe.\n2e groupe : terminaisons is, is, it, issons, issez, issent. (unir) j'unis, tu unis, il/elle unit, nous unissons, vous unissez, ils/elles unissent.",
q:[["Quelles sont les terminaisons du 1er groupe au présent ?",["e, es, e, ons, ez, ent","is, is, it, issons, issez, issent","ais, ais, ait, ions, iez, aient"]],["À quel groupe appartient le verbe aller ?",["Au 3e groupe","Au 1er groupe","Au 2e groupe"]]]},
{id:"f-conj-imparfait",s:"francais",dom:"Conjugaison",d:"2026-09-25",t:"L'imparfait des verbes du 1er et du 2e groupe",g:"conj_imparfait12",
r:"L'imparfait de l'indicatif est un temps du passé.\n1er groupe : radical + ais, ais, ait, ions, iez, aient. (citer) je citais, tu citais, il citait, nous citions, vous citiez, ils citaient.\n2e groupe : radical + issais, issais, issait, issions, issiez, issaient. (remplir) je remplissais, tu remplissais, il remplissait, nous remplissions, vous remplissiez, ils remplissaient.",
q:[["Quelles sont les terminaisons de l'imparfait au 1er groupe ?",["ais, ais, ait, ions, iez, aient","e, es, e, ons, ez, ent","ai, as, a, âmes, âtes, èrent"]],["L'imparfait est un temps…",["du passé","du futur","du présent"]]]},
{id:"f-conj-ps",s:"francais",dom:"Conjugaison",d:"2026-10-02",t:"Le passé simple des verbes du 1er et du 2e groupe",g:"conj_ps12",
r:"On utilise le passé simple pour une action complètement achevée, qui a eu lieu à un moment précis du passé. Il est surtout utilisé à l'écrit, dans le récit.\nExemple : Tidiane montait les escaliers quand il glissa et se blessa.\n1er groupe : radical + ai, as, a, âmes, âtes, èrent. (chanter) je chantai, tu chantas, il chanta, nous chantâmes, vous chantâtes, ils chantèrent.\n2e groupe : radical + is, is, it, îmes, îtes, irent. (choisir) je choisis, tu choisis, il choisit, nous choisîmes, vous choisîtes, ils choisirent.",
q:[["Quand utilise-t-on le passé simple ?",["Pour une action achevée, à un moment précis du passé","Pour une action qui se passe maintenant","Pour une action future"]],["Quelles sont les terminaisons du 2e groupe au passé simple ?",["is, is, it, îmes, îtes, irent","ai, as, a, âmes, âtes, èrent","is, is, it, issons, issez, issent"]]]},
{id:"f-conj-pronom",s:"francais",dom:"Conjugaison",d:"2026-10-23",t:"Les verbes pronominaux au présent",g:"conj_pronom",
r:"À l'infinitif, les verbes pronominaux sont précédés de se ou s' : se laver, se munir, s'enfuir.\nIls se conjuguent avec un pronom réfléchi placé entre le sujet et le verbe : je me, tu te, il/elle se, nous nous, vous vous, ils/elles se (m', t', s' devant une voyelle).\n1er groupe : je me lave, tu te laves, il se lave, nous nous lavons, vous vous lavez, ils se lavent.\n2e groupe : je me munis, nous nous munissons, ils se munissent.\n3e groupe : je m'enfuis, nous nous enfuyons, vous vous enfuyez, ils s'enfuient.",
q:[["Quel pronom réfléchi va avec « nous » ?",["nous","se","me"]],["Quel pronom réfléchi va avec « tu » ?",["te","se","me"]],["Où se place le pronom réfléchi ?",["Entre le sujet et le verbe","Après le verbe","Au début de la phrase"]]]},
{id:"f-conj-3e",s:"francais",dom:"Conjugaison",d:"2026-11-06",t:"Le présent des verbes du 3e groupe",g:"conj_present3",
r:"Au présent, beaucoup de verbes du 3e groupe se terminent par s, s, t, ons, ez, ent.\n(mettre) je mets, tu mets, il/elle met, nous mettons, vous mettez, ils/elles mettent.\n(devoir) je dois, tu dois, il/elle doit, nous devons, vous devez, ils/elles doivent.",
q:[["Comment écrit-on « mettre » avec « il » au présent ?",["il met","il mets","il mette"]],["Comment écrit-on « devoir » avec « nous » au présent ?",["nous devons","nous devrons","nous doivons"]]]},
/* ---------- FRANÇAIS : EXPRESSION ---------- */
{id:"f-exp-recit",s:"francais",dom:"Expression écrite",d:"2026-09-17",t:"Écrire un récit",
r:"Pour écrire une histoire :\n• je respecte les parties du récit : le début, la suite et la fin ;\n• j'utilise des indicateurs de temps et de lieu ;\n• j'écris les actions dans l'ordre avec des connecteurs logiques (puis, ensuite, alors, enfin, mais, or, donc) ;\n• j'utilise des signes de ponctuation appropriés ;\n• j'utilise le présent pour les actions qui se passent au moment où je parle, le passé simple pour les actions passées et brèves, l'imparfait pour les actions passées qui durent.",
q:[["Quelles sont les trois parties d'un récit ?","Le début, la suite et la fin",["debut","suite|milieu","fin"],3],["Quel temps pour une action passée et brève ?",["Le passé simple","L'imparfait","Le présent"]],["Quel temps pour une action passée qui dure ?",["L'imparfait","Le passé simple","Le futur"]],["Cite un connecteur logique.","puis, ensuite, alors, enfin…",["puis|ensuite|alors|enfin|mais|donc|apres|or"]]],
defi:"Écris 3 phrases qui racontent une petite histoire, avec un début, une suite et une fin. Utilise au moins un connecteur (puis, ensuite, enfin…)."},
{id:"f-exp-debut",s:"francais",dom:"Expression écrite",d:"2026-09-25",t:"Le début d'un récit",
r:"Pour écrire le début d'une histoire :\n• j'annonce l'événement que je veux raconter ;\n• j'indique le temps et le lieu où l'histoire se déroule : autrefois, au début, avant, c'était, il y a longtemps, au village, à l'école, au champ… ;\n• j'utilise des verbes au présent, à l'imparfait, au passé simple et au passé composé ;\n• j'utilise des phrases simples ;\n• j'utilise des mots et des expressions en rapport avec l'histoire.",
q:[["Que dois-je indiquer au début d'une histoire ?",["Le temps et le lieu","La fin de l'histoire","La morale"]],["Donne un indicateur de temps pour commencer une histoire.","Autrefois, il était une fois, il y a longtemps…",["autrefois|il etait une fois|il y a longtemps|au debut|avant|un jour|hier"]],["Lequel est un indicateur de lieu ?",["Au village","Autrefois","Ensuite"]]],
defi:"Écris le début d'une histoire en 2 ou 3 phrases. Dis quand et où elle se passe."},
{id:"f-exp-suite",s:"francais",dom:"Expression écrite",d:"2026-10-06",t:"La suite et la fin d'une histoire",
r:"Pour écrire la suite et la fin d'une histoire :\n• j'écris les actions dans l'ordre en utilisant des connecteurs logiques (puis, ensuite, alors, enfin…) ;\n• j'utilise les signes de ponctuation appropriés ;\n• j'utilise des verbes au présent, au passé simple ou à l'imparfait ;\n• j'utilise des mots et des expressions qui expriment les sentiments des personnages.",
q:[["Quel connecteur peut annoncer la fin ?",["Enfin","D'abord","Il était une fois"]],["Que puis-je exprimer pour rendre l'histoire vivante ?",["Les sentiments des personnages","Les numéros de téléphone","Les tables de multiplication"]],["Dans quel ordre écrit-on les actions ?",["Dans l'ordre où elles se passent","Au hasard","De la fin vers le début"]],["Cite un mot qui exprime un sentiment.","joie, peur, tristesse, colère…",["joie|peur|triste|colere|content|heureu|surpris|fier|inquiet|honte"]],["Quels temps utilise-t-on pour la suite d'une histoire ?",["Le présent, le passé simple ou l'imparfait","Seulement le futur","Aucun verbe"]]],
defi:"Écris la fin d'une histoire en 2 ou 3 phrases. Dis ce que ressent le personnage (joie, peur, tristesse…)."},
{id:"f-exp-lettre-ami",s:"francais",dom:"Expression écrite",d:"2026-10-19",t:"J'écris à un ami ou une amie",
r:"Pour écrire une lettre personnelle à un ami ou une amie :\n• je respecte la présentation de la lettre ;\n• j'organise le texte en paragraphes ;\n• j'utilise les pronoms personnels tu, te… ;\n• j'utilise les adjectifs possessifs ton, ta, tes ;\n• j'utilise des phrases variées ;\n• j'utilise les temps de l'indicatif selon la situation (passé, présent, futur).",
q:[["Dans une lettre à un ami, quel pronom j'utilise ?",["tu","vous","ils"]],["Quels adjectifs possessifs vont avec « tu » ?",["ton, ta, tes","votre, vos","leur, leurs"]],["Comment organise-t-on le texte d'une lettre ?",["En paragraphes","En une seule ligne","En colonnes"]],["Quelle formule convient pour finir une lettre à une amie ?",["Gros bisous, à bientôt !","Veuillez agréer mes salutations distinguées.","Monsieur le Directeur,"]],["Quels temps peut-on utiliser dans une lettre ?",["Le passé, le présent et le futur selon la situation","Seulement le passé simple","Aucun"]]],
defi:"Écris 2 ou 3 phrases à ton amie pour lui raconter ta journée. Utilise « tu » et « ton », « ta » ou « tes »."},
{id:"f-exp-lettre-adulte",s:"francais",dom:"Expression écrite",d:"2026-11-02",t:"J'écris à un adulte",
r:"Pour écrire une lettre à un adulte, il faut :\n• respecter sa présentation : le nom et l'adresse de l'expéditeur, le lieu et la date, la formule de politesse, le nom et la signature de l'expéditeur ;\n• organiser le texte en paragraphes pour exprimer ses idées ;\n• utiliser les temps et le mode appropriés ;\n• utiliser les types de phrases appropriés ;\n• utiliser le vous de politesse ;\n• utiliser les adjectifs possessifs votre, vos.",
q:[["À un adulte, j'écris avec…",["le vous de politesse","le tu","le il"]],["Quels adjectifs possessifs vont avec « vous » ?",["votre, vos","ton, ta, tes","mon, ma"]],["Que doit contenir la présentation de la lettre ?",["Le lieu et la date, la formule de politesse, la signature","Seulement un dessin","Le numéro de la classe"]]],
defi:"Écris 2 phrases polies à ton maître ou à ta maîtresse pour lui demander quelque chose. Utilise « vous »."},
{id:"f-exp-lieu",s:"francais",dom:"Expression écrite",d:"2026-11-16",t:"Décrire un lieu non animé",
r:"Pour décrire un lieu non animé :\n• j'indique le lieu ;\n• j'utilise des indicateurs de lieu : d'un côté, de l'autre côté, devant, derrière… ;\n• je le décris dans l'ordre en utilisant des connecteurs logiques : d'abord, ensuite, enfin… ;\n• j'utilise des mots et des expressions en rapport avec la vue et l'odorat : est construit, couvre la ville, odeur nauséabonde… ;\n• j'utilise des adjectifs qualificatifs.",
q:[["Lequel est un indicateur de lieu ?",["derrière","ensuite","hier"]],["Quels sens peut-on utiliser pour décrire un lieu ?",["La vue et l'odorat","Seulement le goût","Aucun"]],["Que veut dire « une odeur nauséabonde » ?",["Une très mauvaise odeur","Une odeur de fleur","Une odeur de pain chaud"]]],
defi:"Décris ta chambre ou ta classe en 3 phrases. Utilise devant, derrière ou à côté, et au moins un adjectif."},
{id:"f-oral-familier",s:"francais",dom:"Expression orale",d:"2026-10-15",t:"Je m'adresse à une personne familière",
r:"Pour m'adresser à une personne familière, j'emploie :\n• des formules comme : s'il te plaît, merci, bonjour, au revoir… ;\n• les pronoms personnels je, tu… ;\n• les temps verbaux selon la situation : les faits sont dans le passé, le présent ou le futur.",
q:[["À une personne familière, je dis…",["s'il te plaît","s'il vous plaît, Monsieur le Directeur","veuillez agréer"]],["Avec une personne familière, quel pronom utilise-t-on ?",["tu","vous","aucun"]],["Je raconte ce que j'ai fait hier. Les faits sont…",["dans le passé","dans le futur","dans le présent"]],["Quelle phrase convient pour parler à ta sœur ?",["Passe-moi le sel, s'il te plaît.","Veuillez me passer le sel, Madame.","Sel."]],["Cite une formule de politesse.","merci, bonjour, au revoir, s'il te plaît",["merci|bonjour|au revoir|s il te plait|bonne journee|bonsoir|pardon"]]]},
{id:"f-oral-ami",s:"francais",dom:"Expression orale",d:"2026-10-19",t:"Je parle à un ami ou une amie",
r:"Quand je m'adresse à un ami, j'emploie :\n• des formules comme : s'il te plaît, merci, au revoir, bonne journée ;\n• des pronoms personnels : tu, te… ;\n• des adjectifs possessifs : ton, ta, tes…",
q:[["Avec un ami, j'utilise…",["ton, ta, tes","votre, vos","leur, leurs"]],["Quelle formule dit-on en partant ?",["Au revoir","Bonjour","Merci"]],["Quelle formule utilise-t-on pour remercier ?",["Merci","Au revoir","Bonne nuit"]],["Quel pronom personnel j'utilise avec mon ami ?",["tu","vous","ils"]],["Complète : « Prête-moi ___ crayon, s'il te plaît. »",["ton","votre","leur"]]]},
/* ---------- SCIENCES ---------- */
{id:"sc-sortie",s:"sciences",dom:"Milieux de vie",d:"2026-09-21",t:"La sortie dans un milieu naturel",
r:"Pour effectuer une sortie dans un milieu de vie, il faut la préparer : choisir le lieu de la sortie et le matériel adapté.\nPendant la sortie, il faut :\n• prendre des notes et récolter des échantillons ;\n• être prudent ;\n• respecter la nature et éviter de capturer ou de tuer les petits animaux ;\n• éviter de jouer avec les objets dangereux.",
q:[["Que faut-il faire avant la sortie ?",["La préparer : choisir le lieu et le matériel","Rien du tout","Manger beaucoup"]],["Que fait-on pendant la sortie ?",["On prend des notes et on récolte des échantillons","On casse les branches","On attrape tous les animaux"]],["Cite deux attitudes à adopter pendant une sortie.","Prendre des notes, être prudent, respecter la nature, ne pas jouer avec les objets dangereux",["note","prudent","respect","danger","echantillon","captur|tuer"],2]]},
{id:"sc-composantes",s:"sciences",dom:"Milieux de vie",d:"2026-09-24",t:"Les composantes d'un milieu de vie",
r:"Chaque milieu de vie est composé :\n• d'êtres vivants : les animaux, les oiseaux, les végétaux… ;\n• d'éléments non vivants : la terre, les cailloux, l'eau, l'air, les roches…\nOn appelle aussi ces milieux de vie des écosystèmes : la forêt, la savane, la lagune, la mer, la montagne…",
q:[["Lequel est un élément non vivant ?",["le caillou","l'oiseau","l'arbre"]],["Lequel est un être vivant ?",["le manguier","l'eau","la roche"]],["Comment appelle-t-on aussi un milieu de vie ?",["Un écosystème","Un échantillon","Une maquette"]],["Cite un écosystème.","La forêt, la savane, la lagune, la mer, la montagne",["foret|savane|lagune|mer|montagne|riviere|fleuve"]]]},
{id:"sc-eau",s:"sciences",dom:"Milieux de vie",d:"2026-10-15",t:"L'eau et les êtres vivants",
r:"Il existe des influences réciproques entre l'eau et les êtres vivants.\nD'une part, l'eau est polluée par les déchets ou les restes d'animaux. Cette pollution représente un danger pour notre santé.\nD'autre part, l'eau est purifiée par l'oxygène produit par les végétaux.",
q:[["Qu'est-ce qui pollue l'eau ?",["Les déchets et les restes d'animaux","L'oxygène des plantes","Le soleil"]],["Pourquoi l'eau polluée est-elle dangereuse ?",["Elle menace notre santé","Elle est trop froide","Elle est trop bleue"]],["Qu'est-ce qui aide à purifier l'eau ?",["L'oxygène produit par les végétaux","Les ordures","Le sable sec"]]]},
{id:"sc-ecosys",s:"sciences",dom:"Milieux de vie",d:"2026-10-20",t:"Les interactions dans les écosystèmes terrestres",
r:"Dans les écosystèmes terrestres, on observe des interactions entre le sol et les êtres vivants, et entre les êtres vivants eux-mêmes (de la même espèce ou d'espèces différentes).\nCes interactions peuvent être bénéfiques ou nuisibles.\nElles se présentent sous forme de commensalisme, de parasitisme, de symbiose, de compétition ou de coopération.",
q:[["Les interactions entre êtres vivants peuvent être…",["bénéfiques ou nuisibles","toujours bénéfiques","toujours nuisibles"]],["Cite une forme d'interaction entre êtres vivants.","Commensalisme, parasitisme, symbiose, compétition, coopération",["commensal|parasit|symbiose|competition|cooperation"]],["Quand des êtres vivants travaillent ensemble pour s'aider, c'est…",["la coopération","la compétition","la pollution"]]]},
{id:"sc-proteger",s:"sciences",dom:"Environnement",d:"2026-10-22",t:"J'agis pour protéger la nature",
r:"La pollution, la déforestation, le braconnage, les feux de brousse et l'urbanisation incontrôlée détruisent la nature.\nLeurs conséquences : la dégradation de la faune et de la flore, de notre environnement immédiat et de notre santé.\nPour protéger la nature et mon cadre de vie, je dois l'entretenir, appliquer le code de protection de l'environnement et inviter mes amis à faire comme moi.",
q:[["Cite une action qui détruit la nature.","La pollution, la déforestation, le braconnage, les feux de brousse, l'urbanisation incontrôlée",["pollu|deforest|braconn|feu|urbanis|couper|ordure"]],["Qu'est-ce que le braconnage ?",["Chasser les animaux sans autorisation","Planter des arbres","Nettoyer la cour"]],["Que puis-je faire pour protéger la nature ?",["Entretenir mon cadre de vie","Brûler les herbes","Jeter les ordures dans la rivière"]]]},
{id:"sc-tiges",s:"sciences",dom:"Les plantes",d:"2026-11-05",t:"Les différents types de tiges",
r:"Il existe deux types de tiges :\n• les tiges aériennes : elles sont dressées (le manguier) ou grimpantes (le haricot) ;\n• les tiges souterraines : ce sont les tubercules comme l'igname et la pomme de terre.",
q:[["Combien de types de tiges y a-t-il ?",2],["La tige du manguier est…",["aérienne et dressée","souterraine","grimpante"]],["La tige du haricot est…",["grimpante","souterraine","dressée comme un tronc"]],["L'igname est…",["une tige souterraine (un tubercule)","une tige grimpante","une feuille"]]]},
{id:"sc-reproduction",s:"sciences",dom:"Les plantes",d:"2026-11-05",t:"La reproduction végétale",
r:"Pour améliorer sa production, l'homme pratique plusieurs techniques de reproduction artificielle :\n• le marcottage : on laisse la racine se développer, puis on coupe les rejets au ras du tronc pour les transplanter ;\n• le greffage : on introduit dans les tissus d'une plante un fragment prélevé sur une autre plante, pour qu'il continue à croître en faisant corps avec elle ;\n• le bouturage : on prélève un morceau de tige, de racine ou de feuille et on l'enfouit dans le sol (l'ananas, le manioc, l'hibiscus).",
q:[["Planter un morceau de tige de manioc dans le sol, c'est…",["le bouturage","le greffage","le marcottage"]],["Introduire un fragment d'une plante dans une autre plante, c'est…",["le greffage","le bouturage","l'arrosage"]],["Pourquoi l'homme pratique-t-il ces techniques ?",["Pour améliorer sa production","Pour détruire les plantes","Pour décorer sa maison"]],["Cite une plante qu'on peut bouturer.","l'ananas, le manioc, l'hibiscus",["ananas|manioc|hibiscus"]]]},
{id:"sc-vertebres",s:"sciences",dom:"Les animaux",d:"2026-11-06",t:"La classe des vertébrés",g:"vertebres",
r:"Les animaux qui possèdent une colonne vertébrale sont des vertébrés. Ils se répartissent en 5 groupes :\n• les poissons : ils vivent dans l'eau, leur corps est couvert d'écailles et ils nagent grâce à leurs nageoires et à leur forme hydrodynamique ;\n• les batraciens (ou amphibiens) : leur peau est nue ; ils vivent dans l'eau et sur la terre : la grenouille, le crapaud ;\n• les reptiles : leur corps est couvert d'écailles soudées ; certains n'ont aucun membre (les serpents), d'autres ont des membres (le crocodile, le lézard, la tortue) ;\n• les oiseaux : leur corps est couvert de plumes, ils ont des ailes et la plupart se déplacent en volant : l'aigle, le pigeon, le perroquet ;\n• les mammifères : leur corps est couvert de poils et les femelles ont des mamelles : le singe, le rat, la lionne.",
q:[["Qu'est-ce qu'un vertébré ?",["Un animal qui a une colonne vertébrale","Un animal sans os","Une plante"]],["Combien de groupes de vertébrés y a-t-il ?",5],["Le corps des oiseaux est couvert de…",["plumes","poils","écailles"]],["Les femelles de quel groupe ont des mamelles ?",["Les mammifères","Les reptiles","Les poissons"]]]},
/* ---------- HISTOIRE-GÉOGRAPHIE ---------- */
{id:"hg-histoire",s:"histgeo",dom:"Histoire",d:"2026-09-25",t:"L'importance de l'étude de l'histoire",
r:"L'histoire est l'étude et la reconstitution du passé de l'humanité. C'est le récit des événements qui ont marqué les sociétés humaines.\nElle s'appuie sur trois sources :\n• les sources orales : les récits des griots, les contes, les proverbes et les devinettes ;\n• les sources écrites : les textes originaux, les documents, les ouvrages, les lettres… ;\n• les vestiges archéologiques : les objets laissés par les hommes, les ruines des maisons, les ossements.",
q:[["Qu'est-ce que l'histoire ?","L'étude et la reconstitution du passé de l'humanité",["passe|autrefois"]],["Sur combien de sources s'appuie l'histoire ?",3],["Les récits des griots sont des sources…",["orales","écrites","archéologiques"]],["Les ruines et les ossements sont des…",["vestiges archéologiques","sources orales","sources écrites"]],["Une lettre ancienne est une source…",["écrite","orale","archéologique"]]]},
{id:"hg-chrono",s:"histgeo",dom:"Histoire",d:"2026-11-02",t:"La chronologie",
r:"La chronologie est la science des temps et des dates. Elle sert à fixer les dates et les repères des événements historiques.\nOn représente les événements sur une frise chronologique :\n• l'Antiquité : de l'apparition de l'écriture (vers 3 000 avant J.-C.) à 476 ;\n• le Moyen Âge : de la chute de l'Empire romain (476) à 1492 ;\n• l'époque moderne : de la découverte de l'Amérique (1492) à 1789 ;\n• l'époque contemporaine : depuis la Révolution française (1789).",
q:[["Qu'est-ce que la chronologie ?",["La science des temps et des dates","L'étude des plantes","La science des nombres"]],["Sur quoi représente-t-on les événements ?",["Une frise chronologique","Une carte","Un tableau de conjugaison"]],["Quel événement de 476 marque la fin de l'Antiquité ?",["La chute de l'Empire romain","La découverte de l'Amérique","La Révolution française"]],["En quelle année a eu lieu la découverte de l'Amérique ?",1492],["En quelle année commence l'époque contemporaine ?",1789],["Quelle période vient après le Moyen Âge ?",["L'époque moderne","L'Antiquité","L'époque contemporaine"]]]},
{id:"hg-kong",s:"histgeo",dom:"Histoire",d:"2026-11-09",t:"Le royaume de Kong",
r:"La ville de Kong existe depuis le XIe siècle. Des commerçants malinkés musulmans s'y installent peu à peu et en font un important centre d'échanges et un centre religieux.\nVers 1710, Sékou Ouattara, à la tête d'une puissante armée, conquiert la ville et fonde le royaume de Kong.\nLe royaume est divisé en provinces. Le roi a tous les pouvoirs.\nAu XIXe siècle, le royaume s'affaiblit à cause de la rébellion des groupes ethniques, de l'attaque de Samory et de la colonisation française.",
q:[["Qui a fondé le royaume de Kong ?",["Sékou Ouattara","Samory","Le roi de France"]],["Vers quelle année le royaume de Kong est-il fondé ?",1710],["Qui s'est installé à Kong et en a fait un centre d'échanges ?",["Des commerçants malinkés musulmans","Des pêcheurs","Des soldats français"]],["Cite une cause de l'affaiblissement du royaume.","La rébellion des groupes ethniques, l'attaque de Samory, la colonisation française",["rebel|samory|colonis|guerre"]],["Qui avait tous les pouvoirs dans le royaume ?",["Le roi","Les commerçants","Les provinces"]]]},
{id:"hg-geo",s:"histgeo",dom:"Géographie",d:"2026-11-02",t:"La géographie et ses outils",
r:"La géographie est l'étude de la Terre et des relations entre elle et les humains.\nElle a deux grandes branches : la géographie physique et la géographie humaine.\nC'est une science importante parce qu'elle aide à comprendre les phénomènes sur la Terre et à les améliorer.\nPour lire une carte, il faut un titre, une légende et une échelle.",
q:[["Qu'est-ce que la géographie ?","L'étude de la Terre et des relations entre elle et les humains",["terre"]],["Quelles sont les deux grandes branches de la géographie ?",["Physique et humaine","Ancienne et moderne","Orale et écrite"]],["Que faut-il pour lire une carte ?",["Un titre, une légende et une échelle","Une règle et une gomme","Un dictionnaire"]]]},
{id:"hg-ci",s:"histgeo",dom:"Géographie",d:"2026-11-06",t:"La Côte d'Ivoire",g:"ciVoisins",
r:"La Côte d'Ivoire est située en Afrique de l'Ouest.\nElle est limitée au nord par le Burkina Faso et le Mali, à l'est par le Ghana, à l'ouest par la Guinée et le Liberia, au sud par l'océan Atlantique.\nSa superficie est de 322 462 km². Elle a une forme presque carrée d'environ 600 km de côté.\nQuelques villes : Yamoussoukro (la capitale politique), Abidjan, Bouaké, Korhogo, Odienné, Daloa, Divo, Gagnoa, Tabou.",

const LEVELS=[[0,"Petite graine"],[40,"Jeune pousse"],[120,"Petit arbre"],[300,"Grand fromager"],[600,"Baobab du savoir"]];
function level(){let i=0;while(i+1<LEVELS.length&&ST.stars>=LEVELS[i+1][0])i++;const nx=LEVELS[i+1];return{name:LEVELS[i][1],next:nx?nx[1]:null,p:nx?(ST.stars-LEVELS[i][0])/(nx[0]-LEVELS[i][0]):1,need:nx?nx[0]-ST.stars:0}}

function speechText(s){return String(s).replace(/\[(\d+|\?)\/(\d+|\?)\]/g,(m,a,b)=>(a==="?"?"combien":a)+" sur "+(b==="?"?"combien":b)).replace(/(\d)[\u00a0\u202f ](?=\d{3}\b)/g,"$1").replace(/(\d)\s*:\s*(\d)/g,"$1 divisé par $2").replace(/×/g," fois ").replace(/−/g," moins ").replace(/\+/g," plus ").replace(/ > /g," est plus grand que ").replace(/ < /g," est plus petit que ").replace(/ = /g," est égal à ").replace(/km²/g,"kilomètres carrés").replace(/___/g,"…").replace(/[«»]/g,"")}
let synthVoice=null;
function pickVoice(){try{const vs=speechSynthesis.getVoices();synthVoice=vs.find(v=>/^fr[-_]FR/i.test(v.lang))||vs.find(v=>/^fr/i.test(v.lang))||null}catch(e){}}
const canSpeak=()=>!!(CAP.tts||("speechSynthesis" in window));
function stopSpeak(){try{CAP.tts&&CAP.tts.stop()}catch(e){}try{window.speechSynthesis&&speechSynthesis.cancel()}catch(e){}}
function speak(text,force){if(!ST.voice&&!force)return;const t=speechText(text).slice(0,1900);if(!t.trim())return;
 if(CAP.tts){CAP.tts.speak([{text:t,language:"fr"}],{language:"fr",rate:ST.rate}).catch(e=>{if(e&&e.code==="not_granted"){CAP.tts=null;speak(text,force)}});return}
 try{if(!window.speechSynthesis)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="fr-FR";if(synthVoice)u.voice=synthVoice;u.rate=ST.rate;speechSynthesis.speak(u)}catch(e){}}

/* ---- construction des quiz ---- */
function normQ(raw){if(Array.isArray(raw)){const[q,b,c,d]=raw;if(Array.isArray(b))return{t:"qcm",q,o:b,x:c};if(typeof b==="number")return{t:"num",q,a:b};return{t:"open",q,a:b,k:c||[],n:d||1}}
 const t=raw.type||raw.t;if(t==="qcm")return{t:"qcm",q:raw.q,o:raw.o,x:raw.x};if(t==="num")return{t:"num",q:raw.q,a:+raw.a,x:raw.x};return{t:"open",q:raw.q,a:raw.a,k:raw.k||[],n:raw.n||1,x:raw.x}}
function coursItem(c,l){if(c.t==="qcm")return mkQ(c.q,c.o[0],c.o.slice(1),c.x||"");
 if(c.t==="num")return{kind:"num",q:c.q,a:c.a,at:fmt(c.a),x:c.x||""};return{kind:"open",q:c.q,at:c.a,k:c.k,need:c.n||1,x:c.x||"",rule:l.r}}
function tagItem(it,l){it.lid=l.id;it.lt=l.t;it.s=l.s;return it}
function itemsFor(l,n){const out=[];const L=levelFor(l.id);const cq=shuffle((l.q||[]).map(normQ));const g=l.g&&GEN[l.g];let ci=0;
 for(let k=0;k<n;k++){let it=null;const wantCours=!g||(k%3===1&&ci<cq.length);if(wantCours&&ci<cq.length)it=coursItem(cq[ci++],l);else if(g){try{it=GEN[l.g](L)}catch(e){it=null}}if(!it&&ci<cq.length)it=coursItem(cq[ci++],l);if(!it)break;out.push(tagItem(it,l))}
 return out}
function defiItem(l){return tagItem({kind:"defi",q:l.defi,at:"",x:"",rule:l.r},l)}
function weighted(pool,n){const latest=Math.max(...pool.map(l=>dayNum(l.d||today())));const td=today();
 let arr=pool.map(l=>{const m=mastery(l.id);const st=ST.les[l.id];let w=1+(1-(m??.4))*2;if(!st)w+=1;if(latest-dayNum(l.d||td)<=14)w+=1.5;if(st&&st.last===td)w*=.4;return[l,w]});const res=[];
 while(res.length<n&&arr.length){const tot=arr.reduce((a,b)=>a+b[1],0);let r=Math.random()*tot;let i=0;while(i<arr.length-1&&(r-=arr[i][1])>0)i++;res.push(arr[i][0]);arr.splice(i,1)}return res}
function startQuiz(items,title,back){if(!items.length){toast("Pas encore de questions pour cette leçon.");return}Q={items,i:0,res:[],stars:0,run:0,title,back,wrong:[],answered:false,retry:false};go({v:"quiz"})}
function mixQuiz(pool,title,back){const ls=weighted(pool,Math.min(5,pool.length));let items=[];for(const l of ls)items=items.concat(itemsFor(l,2));let k=0;while(items.length<10&&k++<10){const l=pick(pool);items=items.concat(itemsFor(l,1))}startQuiz(shuffle(items).slice(0,10),title,back)}

function afterQuiz(){const it=Q.items[Q.i];Q.answered=false;const inp=$("#ain");if(inp&&inp.type!=="hidden"){inp.addEventListener("keydown",e=>{if(e.key==="Enter"&&inp.tagName==="INPUT"){e.preventDefault();validate()}});setTimeout(()=>inp.focus({preventScroll:true}),60)}sayItem(it)}

async function ai(prompt,opts){const ctl=new AbortController();const tm=setTimeout(()=>ctl.abort(),(opts&&opts.ms)||25000);
 try{const r=await CAP.sample(prompt,Object.assign({modelTier:"quick",signal:ctl.signal},opts||{},{ms:undefined}));clearTimeout(tm);return parseJSON(r&&r.text)}catch(e){clearTimeout(tm);if(e&&e.code==="not_granted")CAP.sample=null;return null}}
function parseJSON(t){if(!t)return null;const a=t.indexOf("{"),b=t.lastIndexOf("}");if(a<0||b<a)return null;try{return JSON.parse(t.slice(a,b+1))}catch(e){return null}}
const ROLE="Tu es Kalou, un maître d'école bienveillant et pédagogue d'une classe de CM1 en Côte d'Ivoire (programme ivoirien). Tu t'adresses à une élève de 9 ou 10 ans : tu la tutoies, avec des phrases courtes et simples, en français correct.";
function kwCheck(it,ans){const h=" "+normHard(ans)+" ";let hits=0;for(const k of it.k||[])if(String(k).split("|").some(a=>{const n=normHard(a);return n&&h.includes(n)}))hits++;return hits>=(it.need||1)}
function sound(s){return String(s||"").toLowerCase().replace(/[’`]/g,"'").split(/[\s']+/).filter(Boolean).map(w=>{w=w.replace(/[.!?,;:]/g,"");if(!/ment$/.test(w)&&w.length>4)w=w.replace(/ent$/,"");w=w.replace(/(aient|ais|ait|ai|ez|er|ées|és|ée|é)$/,"É");w=w.replace(/[estxd]+$/,"");return w.normalize("NFD").replace(/[\u0300-\u036f]/g,"")}).join(" ")}
async function check(it,ans,mic){const raw=String(ans||"").trim();
 switch(it.kind){
 case"qcm":return{ok:+ans===it.a};
 case"num":{const v=parseNum(raw);return{ok:v!=null&&Math.abs(v-it.a)<1e-9}}
 case"roman":return{ok:raw.toUpperCase().replace(/[^IVXLCDM]/g,"")===it.a};
 case"frac":{const[a,b]=it.a;const m=raw.match(/(\d+)\s*(?:\/|sur)\s*(\d+)/i);if(m)return{ok:+m[1]===a&&+m[2]===b};
  const sp=normHard(raw).split(" sur ");if(sp.length===2){const x=wordsToNum(sp[0]),y=wordsToNum(sp[1]);if(x!=null&&y!=null)return{ok:x===a&&y===b}}
  const strip=s=>normHard(s).replace(/s\b/g,"");const m2=normHard(raw).match(/^(\d+) ([a-z]+)$/);if(m2&&+m2[1]===a)return{ok:strip(m2[2])===strip(fracWords(a,b).split(" ").slice(-1)[0])};return{ok:strip(raw)===strip(fracWords(a,b))}}
 case"text":{const alts=[it.a,...(it.alts||[])];const ns=normSoft(raw);if(alts.some(x=>normSoft(x)===ns))return{ok:true};if(alts.some(x=>normHard(x)===normHard(raw)))return{ok:true,note:"Attention aux accents : on écrit « "+it.a+" »."};if(mic&&alts.some(x=>sound(x)===sound(raw)))return{ok:true,note:"Bien dit ! À l'écrit, on écrit : « "+it.a+" »."};return{ok:false}}
 case"open":{if(!raw)return{ok:false};const kw=kwCheck(it,raw);if(CAP.sample){const r=await ai(ROLE+"\n\nQuestion posée : "+it.q+"\nRéponse attendue (modèle) : "+it.at+"\nRéponse de l'élève (elle peut venir de la dictée vocale, l'orthographe peut être approximative) : « "+raw+" »\nCe que dit la leçon :\n"+(it.rule||"")+"\n\nDécide si l'idée principale de sa réponse est juste. Sois exigeant sur le sens mais pas sur la formulation. Si c'est faux, dis-le clairement (jamais « presque » ni « pas tout à fait ») et explique pourquoi en t'appuyant sur la leçon, comme un bon maître. Réponds UNIQUEMENT avec un objet JSON : {\"ok\": true ou false, \"msg\": \"si juste : une félicitation variée ; si faux : l'explication du pourquoi en 1 ou 2 phrases courtes (35 mots maximum)\"}");if(r&&typeof r.ok==="boolean")return{ok:r.ok,msg:r.msg}}return{ok:kw}}
 case"defi":{if(!raw)return{ok:false};if(CAP.sample){const r=await ai(ROLE+"\n\nConsigne d'écriture : "+it.q+"\nRègles de la leçon :\n"+it.rule+"\nTexte de l'élève : « "+raw+" »\n\nÉvalue si la consigne est respectée dans l'ensemble (ok = true si oui, même avec de petites fautes). Réponds UNIQUEMENT en JSON : {\"ok\": true ou false, \"msg\": \"2 phrases maximum : un compliment précis, puis un conseil pour améliorer ; si une faute d'orthographe importante est présente, corrige-la\"}",{modelTier:"default"});if(r&&typeof r.ok==="boolean")return{ok:r.ok,msg:r.msg}}
  const words=raw.split(/\s+/).length;return{ok:words>=8,msg:words>=8?"Merci pour ton texte ! Relis-le avec la règle de la leçon pour vérifier que tout y est.":"Ton texte est un peu court. Essaie d'écrire au moins 2 ou 3 phrases."}}
 }return{ok:false}}
const PRAISE=["Bravo !","Excellent !","C'est juste !","Bien joué !","Parfait !","Super !","Magnifique !","Exactement !","Très bien !","Formidable !","Génial, c'est ça !","Tu as tout compris !","Bonne réponse !","Impeccable !","Chapeau !","Bien vu !","Quelle championne !","Tu progresses bien !","C'est ça, continue !","Excellent travail !","Félicitations !","Tu as bien appris ta leçon !"];
let lastPraise="";
function praise(){let p;do{p=pick(PRAISE)}while(p===lastPraise&&PRAISE.length>1);lastPraise=p;if(ST.name&&Math.random()<.25)p=p.replace(/ !$/,", "+ST.name+" !");return p}
const RSTOP=new Set("dans avec pour quel quelle quels quelles sont une des les qui que quoi comment combien cette celui celle elle elles leur leurs mais plus aussi entre sous sur fait faire peut".split(" "));
function lessonBit(it){const l=byId(it.lid);if(!l||!l.r)return"";const lines=l.r.split("\n").map(x=>x.replace(/^•\s*/,"").trim()).filter(Boolean);if(!lines.length)return"";if(it.hint){const f=lines.find(x=>x.includes(it.hint));if(f)return f}
 const tk=s=>normHard(String(s).replace(/\[(\d+|\?)\/(\d+|\?)\]/g," ")).split(" ").filter(w=>w.length>3&&!RSTOP.has(w));const q=new Set(tk(it.q+" "+(it.at||"")+" "+(it.x||"")));
 let best=0,bi=0;lines.forEach((ln,i)=>{const t=tk(ln);const sc=t.filter(w=>q.has(w)).length/Math.sqrt(t.length||1);if(sc>best){best=sc;bi=i}});
 let out=lines[bi];if(/:$/.test(out)&&lines[bi+1])out+=" "+lines[bi+1];return out}
async function answer(val,dunno,mic){if(Q.answered)return;Q.answered=true;stopMic();stopSpeak();const it=Q.items[Q.i];
 document.querySelectorAll("#ans button,#ans input,#ans textarea").forEach(e=>e.disabled=true);
 const fb=$("#fb");let res;
 if(dunno)res={ok:false};else if(it.kind==="open"||it.kind==="defi"){fb.innerHTML='<div class="fb"><span class="spin"></span> Kalou lit ta réponse…</div>';res=await check(it,val,mic)}else res=await check(it,val,mic);
 if(it.kind==="qcm"){const bs=document.querySelectorAll(".opt");bs[it.a]&&bs[it.a].classList.add("good");if(!res.ok&&!dunno&&bs[+val])bs[+val].classList.add("bad")}
 Q.res[Q.i]=res.ok;const st=ST.les[it.lid]||(ST.les[it.lid]={n:0,ok:0,h:"",last:""});
 if(!Q.retry){st.n++;if(res.ok)st.ok++;st.h=(st.h+(res.ok?"1":"0")).slice(-20)}st.last=today();
 let gained=0;if(res.ok){Q.run++;gained=Q.retry?1:(Q.run>=3?2:1);Q.stars+=gained}else{Q.run=0;if(!Q.retry)Q.wrong.push(it)}
 persistLocal();
 const head=res.ok?praise()+(Q.run>=3&&!Q.retry?" "+Q.run+" de suite !":""):dunno?"Voici la bonne réponse.":"Faux.";const bit=!res.ok&&it.kind!=="defi"?lessonBit(it):"";const why=!res.ok&&it.x&&it.x!==bit?it.x:"";
 const showAns=it.kind!=="defi"&&it.at&&!(res.ok&&it.kind!=="open");
 const exp=(res.msg?"<p>"+esc(res.msg)+"</p>":"")+(res.note?"<p>"+esc(res.note)+"</p>":"")+(showAns?"<p><b>"+(it.kind==="open"?"Réponse modèle":"La bonne réponse")+" :</b> "+rt(it.at)+"</p>":"")+(why?"<p><b>Pourquoi ?</b> "+rt(why)+"</p>":"")+(res.ok&&it.x&&it.kind==="qcm"&&Math.random()<.4?"<p>"+rt(it.x)+"</p>":"")+(!res.ok&&it.pose?it.pose:"")+(bit?'<div class="recall"><b>Rappelle-toi la leçon :</b> '+rt(bit)+"</div>":"")+(it.kind==="defi"&&!CAP.sample?"<p class=\"small\">Vérifie avec la règle : "+rt(it.rule.split("\n")[0])+"</p>":"");
 fb.innerHTML='<div class="fb '+(res.ok?"ok":"ko")+'"><div class="h">'+(res.ok?IC.ok:IC.ko)+"<span>"+esc(head)+"</span>"+(gained?'<span class="pill burst" style="margin-left:auto">+'+gained+" "+IC.star(18)+"</span>":"")+"</div>"+exp+'<div class="row" style="margin-top:12px"><button class="btn" data-a="next" id="nbtn">'+(Q.i+1<Q.items.length?"Question suivante":"Voir mon score")+"</button></div></div>";
 const p=document.querySelector(".pill");if(p)p.innerHTML=IC.star(20)+" "+Q.stars;
 const dots=document.querySelectorAll(".dots i");if(dots[Q.i])dots[Q.i].className=res.ok?"g":"r";
 speak(res.ok?head+(res.msg?" "+res.msg:""):head+(res.msg?" "+res.msg:"")+(showAns?" La bonne réponse est : "+(it.at||"")+".":"")+(why?" Pourquoi ? "+why:bit?" Rappelle-toi la leçon : "+bit:""));
 const nb=$("#nbtn");try{nb.scrollIntoView({behavior:"smooth",block:"nearest"});nb.focus({preventScroll:true})}catch(e){}}
function validate(){const inp=$("#ain");if(!inp)return;const v=inp.value;if(!v.trim()){toast("Écris ou dis ta réponse, ou touche « Je ne sais pas ».");return}answer(v,false,inp.dataset.mic==="1")}
function finishQuiz(){const n=Q.items.length,ok=Q.res.filter(Boolean).length;let bonus=0;if(!Q.retry&&n>=6&&ok===n)bonus=3;Q.bonus=bonus;
 ST.stars+=Q.stars+bonus;const td=today();if(ST.day.d!==td)ST.day={d:td,stars:0};ST.day.stars+=Q.stars+bonus;
 if(ST.lastDay!==td){ST.streak=ST.lastDay&&dayNum(td)-dayNum(ST.lastDay)===1?ST.streak+1:1;ST.lastDay=td}
 save();go({v:"end"})}
function endV(){const n=Q.items.length,ok=Q.res.filter(Boolean).length,p=ok/n;const msg=p>=.9?"Magnifique ! Tu maîtrises très bien.":p>=.7?"Très bien ! Encore un petit effort.":p>=.5?"C'est bien, continue à t'entraîner.":"On va revoir ça ensemble, tu vas y arriver !";
 setTimeout(()=>speak(ok+" sur "+n+". "+msg),200);
 return '<div class="card endsc stack"><div style="max-width:220px;margin:0 auto">'+kalou("100%")+'</div><div class="score burst">'+ok+" / "+n+'</div><p style="font-size:20px;margin:0">'+esc(msg)+'</p><p class="row" style="justify-content:center;margin:0"><span class="pill">+'+(Q.stars+(Q.bonus||0))+" "+IC.star(20)+"</span>"+(Q.bonus?'<span class="pill">Sans faute : +3 bonus</span>':"")+'</p>'+
 (Q.wrong.length&&!Q.retry?'<button class="btn big" data-a="retry">Corriger mes '+Q.wrong.length+" erreur"+(Q.wrong.length>1?"s":"")+"</button>":"")+
 '<button class="btn big g" data-a="again">Encore un quiz</button><button class="btn big gh" data-a="'+(Q.back&&Q.back.v==="lesson"?"lesson":Q.back&&Q.back.v==="subj"?"subj":"home")+'" data-p="'+esc(Q.back&&(Q.back.id||Q.back.s)||"")+'">Retour</button></div>'}

function stopMic(){if(MIC_ON&&CAP.dict){CAP.dict.stop().catch(()=>{})}MIC_ON=false}
const EN=new Set("the is and you i it its it's what that this to of in my yes are was with for he she they we have do don't can so just like one two three four five six seven eight nine ten twenty hundred thousand okay ok please thank thanks answer".split(" "));
const FRW=new Set("le la les de des du est et je tu il elle un une c'est que qui pas oui non deux trois quatre cinq sept huit neuf dix vingt cent mille sur plus moins on ce ces ses mais au aux".split(" "));
function looksEnglish(t){const w=String(t).toLowerCase().replace(/[’]/g,"'").replace(/[^a-zàâçéèêëîïôûùüÿœ' ]/g," ").split(/\s+/).filter(Boolean);let en=0,fr=0;for(const x of w){if(EN.has(x))en++;if(FRW.has(x))fr++}return en>=1&&en>fr}
function disableMic(msg){CAP.dict=null;CAP.dictNote=msg;stopMic();document.querySelectorAll(".mic").forEach(b=>b.remove());const h=$("#heard");if(h)h.textContent=KBTIP;toast(msg,7000)}
function setupDict(d){d.onPartial(({text})=>{if(!micTarget)return;const v=(micBase+" "+text).trim();if(micTarget.type==="hidden"){const h=$("#heard");h&&(h.textContent="J'entends : "+v)}else micTarget.value=v});
 d.onFinal(({text})=>{if(!micTarget)return;if(looksEnglish(text)){CAP.eng++;micTarget.value=micBase;const h=$("#heard");if(CAP.eng>=2){d.stop().catch(()=>{});disableMic("Le micro de la page écoute en anglais. "+KBTIP)}else{if(h)h.textContent="";toast("Le micro a compris de l'anglais. Réessaie en parlant bien distinctement.",5000)}return}micBase=(micBase+" "+text).trim();micTarget.value=micBase;const h=$("#heard");if(h)h.textContent=micTarget.type==="hidden"?"J'ai entendu : "+micBase:"";if(micTarget.type==="hidden")voiceChoose(micBase)});
 d.onState(({state,reason})=>{if(state==="idle"&&reason==="unavailable"){CAP.dl++;if(CAP.dl>=DLANGS.length)disableMic("Le micro de la page ne propose pas le français ici. "+KBTIP)}MIC_ON=state==="listening";document.querySelectorAll(".mic").forEach(b=>b.classList.toggle("on",MIC_ON))})}
function voiceChoose(t){if(!Q||Q.answered)return;const it=Q.items[Q.i];const h=normHard(t).replace(/^(c est|la reponse est|reponse|je dis|je pense que c est|je choisis)\s+/,"").replace(/^(la|le|l) /,"").trim();
 const LET={a:["a","ah","reponse a"],b:["b","be","bebe","reponse b"],c:["c","ce","se","reponse c"],d:["d","de","reponse d"]};
 for(let i=0;i<it.o.length;i++){const L="abcd"[i];if(LET[L].includes(h)){stopMic();answer(String(i),false,true);return}}
 const STOP=new Set(["le","la","les","l","un","une","des","de","du","d","et","a","est","en","au","aux"]);
 const toks=s=>normHard(s.replace(/[<>=]/g,"")).split(" ").filter(w=>w&&!STOP.has(w));const ht=new Set(toks(h));
 const sc=it.o.map(o=>{const ot=toks(o);if(!ot.length)return 0;const no=ot.join(" ");if(h===no||h.includes(no))return 2;return ot.filter(w=>ht.has(w)).length/ot.length});
 const best=Math.max(...sc);const top=sc.filter(x=>x===best).length;
 if(best>=.6&&top===1){stopMic();answer(String(sc.indexOf(best)),false,true)}else toast("Je n'ai pas bien compris. Redis ta réponse ou touche-la.")}

async function shrink(file){try{const bmp=await createImageBitmap(file);const k=Math.min(1,1600/Math.max(bmp.width,bmp.height));const c=document.createElement("canvas");c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);return await new Promise(r=>c.toBlob(b=>r(b||file),"image/jpeg",.85))}catch(e){return file}}

 return{id:"x-"+Date.now().toString(36)+"-"+i,s,dom:String(o.dom||"Leçon").slice(0,40),d:/^\d{4}-\d{2}-\d{2}$/.test(o.d||"")?o.d:today(),t:String(o.t).slice(0,90),g:GEN[o.g]?o.g:"",r:String(o.r).slice(0,3000),q,defi:o.defi?String(o.defi).slice(0,300):"",added:Date.now()}}

 const st=$("#pstat"),btn=$("#abtn");btn.disabled=true;st.innerHTML='<p><span class="spin"></span> Claude lit les leçons… (environ une minute)</p>';
 let images=[];if(files.length){let lim={};try{lim=await CAP.sample.limits()}catch(e){}if(lim&&lim.images)images=await Promise.all(files.map(shrink));else if(!text){st.innerHTML='<p class="note">Les photos ne peuvent pas être lues ici. Colle le texte de la leçon, ou envoie les photos à Claude dans la conversation.</p>';btn.disabled=false;return}}
 const prompt=ROLE+"\n\nTu reçois "+(images.length?images.length+" photo(s) de pages":"le texte")+" du cahier de leçons de l'élève (CM1, Côte d'Ivoire). Extrais chaque leçon distincte : une page peut en contenir plusieurs, chacune avec un titre de matière (Mathématiques, Grammaire, Conjugaison, Orthographe, Vocabulaire, Expression écrite, Expression orale, Sciences et technologie, Histoire, Géographie, EDHC…) et souvent une date.\nPour chaque leçon :\n- réécris le contenu en le CORRIGEANT : l'élève fait des fautes en recopiant (orthographe, conjugaison, erreurs de contenu) ; garde ce que le maître a enseigné ;\n- \"r\" : le résumé clair de la leçon, lignes séparées par \\n, puces avec « • » si besoin ;\n- \"q\" : 8 questions variées de révision et d'application, niveau CM1, exemples ivoiriens si possible ; pour l'orthographe, uniquement des qcm ;\n- \"defi\" : une consigne d'écriture courte seulement pour l'expression écrite, sinon \"\".\n"+GEN_DESC+"\nRéponds UNIQUEMENT en JSON :\n{\"lessons\":[{\"s\":\"maths|ortho|conj|gram|voc|expe|expo|sciences|histoire|geo|edhc\",\"dom\":\"Nombres, Opérations, Fractions, Orthographe, Grammaire, Conjugaison, Vocabulaire, Expression écrite, Milieux de vie, Histoire, Géographie, Citoyenneté…\",\"d\":\"AAAA-MM-JJ\",\"t\":\"titre court\",\"g\":\"\",\"r\":\"…\",\"defi\":\"\",\"q\":[{\"type\":\"qcm\",\"q\":\"…\",\"o\":[\"bonne réponse\",\"fausse 1\",\"fausse 2\"],\"x\":\"courte explication\"},{\"type\":\"num\",\"q\":\"…\",\"a\":123},{\"type\":\"open\",\"q\":\"…\",\"a\":\"réponse modèle\",\"k\":[\"mot clé\",\"autre|synonyme\"]}]}]}\nDans un qcm, la bonne réponse est toujours la première. Les nombres décimaux JSON utilisent un point. Si la date est illisible, mets "+today()+"."+(text?"\n\nTexte fourni par le parent :\n"+text:"");
 const r=await ai(prompt,{modelTier:"default",images:images.length?images:undefined,ms:150000});btn.disabled=false;
 const ls=r&&Array.isArray(r.lessons)?r.lessons.map(cleanLesson).filter(Boolean):[];
 if(!ls.length){st.innerHTML='<p class="note">Je n\'ai pas réussi à lire de leçon. Essaie une photo plus nette, bien éclairée, une page à la fois.</p>';return}
 PENDING=ls;render()}
async function savePending(){if(!PENDING)return;const ls=PENDING;PENDING=null;let ok=0;
 for(const l of ls){if(CAP.db){try{await CAP.db.collection("lessons").doc(l.id).set(l);ok++}catch(e){toast("Erreur d'enregistrement : "+(e&&e.code||""))}}else{EXTRA.push(l);ok++}}
 if(!CAP.db){try{localStorage.setItem(LS+"-extra",JSON.stringify(EXTRA))}catch(e){}rebuild()}
 toast(ok+" leçon"+(ok>1?"s":"")+" ajoutée"+(ok>1?"s":"")+" !");render()}

/* ============ ACTIONS ============ */
const ACT={
 home:()=>go({v:"home"}),subj:p=>go({v:"subj",s:p}),lesson:p=>go({v:"lesson",id:p}),
 mix:()=>mixQuiz(LESSONS,"Interroge-moi",{v:"home"}),
 mixs:p=>mixQuiz(LESSONS.filter(l=>l.s===p),SUBJ[p].n,{v:"subj",s:p}),
 recent:()=>{const lat=Math.max(...LESSONS.map(l=>dayNum(l.d)));const pool=LESSONS.filter(l=>lat-dayNum(l.d)<=7);mixQuiz(pool.length?pool:LESSONS,"Leçons de la semaine",{v:"home"})},
 practice:p=>{const l=byId(p);if(!l)return;const it=itemsFor(l,8);if(l.defi)it.push(defiItem(l));startQuiz(it,l.t,{v:"lesson",id:p})},
 defi:p=>{const l=byId(p);l&&startQuiz([defiItem(l)],l.t,{v:"lesson",id:p})},
 invent:async(p,b)=>{const l=byId(p);if(!l||!CAP.sample)return;b.disabled=true;b.innerHTML='<span class="spin"></span> Kalou invente…';
  const r=await ai(ROLE+"\n\nLeçon : "+l.t+" ("+SUBJ[l.s].n+", "+l.dom+")\nContenu de la leçon :\n"+l.r+"\n\nInvente 6 nouvelles questions variées pour vérifier qu'elle a compris ET qu'elle sait appliquer cette leçon (surtout des exercices d'application). Questions courtes, niveau CM1, exemples tirés de la vie en Côte d'Ivoire quand c'est possible. Pour l'orthographe, uniquement des qcm. Réponds UNIQUEMENT en JSON :\n{\"q\":[{\"type\":\"qcm\",\"q\":\"…\",\"o\":[\"bonne réponse\",\"fausse 1\",\"fausse 2\"],\"x\":\"courte explication\"},{\"type\":\"num\",\"q\":\"…\",\"a\":123,\"x\":\"…\"},{\"type\":\"open\",\"q\":\"…\",\"a\":\"réponse modèle\",\"k\":[\"mot clé\",\"autre|synonyme\"],\"x\":\"…\"}]}\nDans un qcm, la bonne réponse est toujours la première. Les nombres décimaux JSON utilisent un point.",{modelTier:"default",ms:60000});
  const qs=r&&Array.isArray(r.q)?r.q.map(x=>{try{return tagItem(coursItem(normQ(x),l),l)}catch(e){return null}}).filter(it=>it&&it.q&&(it.kind!=="qcm"||it.o.length>1)):[];
  if(!qs.length){b.disabled=false;b.textContent="Kalou invente de nouvelles questions";toast("Kalou n'a pas réussi cette fois. Réessaie dans un instant.");return}startQuiz(qs,l.t,{v:"lesson",id:p})},
 readrule:p=>{const l=byId(p);l&&speak(l.t+". "+l.r.replace(/•/g,""),true)},
 say:()=>Q&&sayItem(Q.items[Q.i]),
 choose:p=>answer(p),validate:()=>validate(),dunno:()=>answer("",true),
 next:()=>{if(Q.i+1<Q.items.length){Q.i++;render()}else finishQuiz()},
 quit:()=>{if(Q&&Q.i>0){ST.stars+=Q.stars;save()}go(Q&&Q.back||{v:"home"})},
 retry:()=>{const w=Q.wrong.map(it=>Object.assign({},it));const back=Q.back;Q={items:w,i:0,res:[],stars:0,run:0,title:"Corrections",back,wrong:[],answered:false,retry:true};go({v:"quiz"})},
 again:()=>{const b=Q&&Q.back;if(b&&b.v==="lesson")ACT.practice(b.id);else if(b&&b.v==="subj")ACT.mixs(b.s);else ACT.mix()},
 mic:()=>{const d=CAP.dict;if(!d)return;if(MIC_ON){d.stop().catch(()=>{});return}try{CAP.tts&&CAP.tts.stop()}catch(e){}try{window.speechSynthesis&&speechSynthesis.cancel()}catch(e){}
  micTarget=$("#ain");if(micTarget)micTarget.dataset.mic="1";micBase=micTarget&&micTarget.type!=="hidden"?micTarget.value.trim():"";if(micTarget&&micTarget.type==="hidden")micTarget.value="";
  d.start({language:DLANGS[Math.min(CAP.dl,DLANGS.length-1)]}).catch(e=>{MIC_ON=false;document.querySelectorAll(".mic").forEach(b=>b.classList.remove("on"));if(e&&(e.code==="unavailable"||e.code==="invalid_argument")){CAP.dl++;if(CAP.dl>=DLANGS.length)disableMic("Le micro de la page ne propose pas le français ici. "+KBTIP);else toast("Touche encore le micro pour réessayer.");return}if(e&&e.code==="stopped")return;if(e&&e.code==="no_speech"){toast("Je n'ai rien entendu. Touche le micro et parle.");return}if(e&&e.code==="not_granted"){CAP.dict=null;toast("Le micro n'est pas autorisé : tu peux écrire ta réponse.");document.querySelectorAll(".mic").forEach(b=>b.remove())}else toast("Le micro ne répond pas. Réessaie.")})},
 setname:()=>{const v=($("#fname").value||"").trim().slice(0,30);if(!v)return;ST.name=v;save();render();speak("Bonjour "+v+" ! Je suis Kalou. On révise ensemble ?",true)},
 install:()=>{installAsked=false;doInstall()},
 gate:()=>go({v:"gate"}),
 gatego:()=>{if(+($("#gin").value||0)===gateAns)go({v:"parent"});else toast("Ce n'est pas le bon résultat.")},
 savename:()=>{ST.name=($("#pname").value||"").trim().slice(0,30);ST.voice=$("#pvoice").checked;save();toast("Réglages enregistrés.")},
 rate:p=>{ST.rate=+p;save();render()},
 testvoice:()=>speak("Bonjour "+(ST.name||"")+" ! Je suis Kalou. On révise ensemble ?",true),
 analyze:()=>analyze(),savepending:()=>savePending(),cancelpending:()=>{PENDING=null;render()},
 dellesson:async(p,b)=>{if(b.dataset.c!=="1"){b.dataset.c="1";b.textContent="Confirmer ?";return}if(CAP.db){try{await CAP.db.collection("lessons").doc(p).delete()}catch(e){toast("Suppression impossible.")}}else{EXTRA=EXTRA.filter(l=>l.id!==p);try{localStorage.setItem(LS+"-extra",JSON.stringify(EXTRA))}catch(e){}rebuild();render()}},
 reset:(p,b)=>{if(b.dataset.c!=="1"){b.dataset.c="1";b.textContent="Confirmer l'effacement";return}const keep={name:ST.name,voice:ST.voice,rate:ST.rate};ST=Object.assign({stars:0,streak:0,lastDay:"",day:{d:"",stars:0},les:{},updated:0},keep);save();toast("Progrès effacés.");render()}
};
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b||b.disabled)return;const f=ACT[b.dataset.a];if(f){e.preventDefault();f(b.dataset.p,b,e)}});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="gin")ACT.gatego()});

/* ============ DÉMARRAGE ============ */
try{const s=JSON.parse(localStorage.getItem(LS)||"null");if(s&&typeof s==="object")ST=Object.assign(ST,s)}catch(e){}
try{const x=JSON.parse(localStorage.getItem(LS+"-extra")||"null");if(Array.isArray(x)){EXTRA=x;rebuild()}}catch(e){}
try{pickVoice();if(window.speechSynthesis)speechSynthesis.onvoiceschanged=pickVoice}catch(e){}
render();
function nativeDict(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return null;let rec=null,hp=()=>{},hf=()=>{},hs=()=>{};
 return{start(){return new Promise((res,rej)=>{try{rec=new SR();rec.lang="fr-FR";rec.interimResults=true;rec.continuous=false;rec.maxAlternatives=1;
  rec.onstart=()=>{hs({state:"listening"});res()};
  rec.onresult=e=>{let fin="",part="";for(let i=e.resultIndex;i<e.results.length;i++){const r=e.results[i];if(r.isFinal)fin+=r[0].transcript;else part+=r[0].transcript}if(part)hp({text:part});if(fin){hp({text:""});hf({text:" "+fin})}};
  rec.onerror=ev=>{const c=ev.error==="not-allowed"||ev.error==="service-not-allowed"?"not_granted":ev.error==="no-speech"?"no_speech":ev.error==="aborted"?"stopped":"upstream_error";hs({state:"idle",reason:c});rej({code:c})};
  rec.onend=()=>hs({state:"idle",reason:"stopped"});rec.start()}catch(err){rej({code:"upstream_error"})}})},
  stop(){try{rec&&rec.stop()}catch(e){}return Promise.resolve()},onPartial(f){hp=f},onFinal(f){hf=f},onState(f){hs=f}}}
(()=>{const d=nativeDict();if(d){CAP.dict=d;try{setupDict(d)}catch(e){CAP.dict=null}}
 if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
 render()})();
})();
